<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Create Blood Request</title>

<link rel="stylesheet" href="../src/assets/css/style.css">
<link rel="stylesheet" href="../src/assets/css/components.css">
<link rel="stylesheet" href="../src/assets/css/responsive.css">

<!-- Leaflet Map CSS -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
```

</head>

<body>

```
<main class="request-page">

    <section class="request-card">

        <h1>Create Blood Request</h1>

        <p>
            Enter the details to request blood.
        </p>

        <form id="requestForm">

            <label>
                Blood Group
            </label>

            <select
                id="blood_group"
                required
            >

                <option value="">
                    Select Blood Group
                </option>

                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>


            <label>
                Units Needed
            </label>

            <input
                type="number"
                id="units_needed"
                min="1"
                value="1"
                required
            >


            <label>
                Emergency Level
            </label>

            <select
                id="emergency_level"
                required
            >

                <option value="">
                    Select Emergency Level
                </option>

                <option value="LOW">
                    Low
                </option>

                <option value="MEDIUM">
                    Medium
                </option>

                <option value="HIGH">
                    High
                </option>

                <option value="CRITICAL">
                    Critical
                </option>

            </select>


            <label>
                Hospital Name
            </label>

            <input
                type="text"
                id="hospital_name"
                required
            >


            <!-- =============================== -->
            <!-- LOCATION MAP -->
            <!-- =============================== -->

            <label>
                Select Hospital Location
            </label>

            <p class="map-help-text">

                Click on the map to select the hospital location.

            </p>


            <div
                id="hospitalMap"
            ></div>


            <!-- Hidden coordinate fields -->

            <input
                type="hidden"
                id="hospital_latitude"
                required
            >


            <input
                type="hidden"
                id="hospital_longitude"
                required
            >


            <p
                id="selectedLocation"
                class="selected-location"
            >

                Please select the hospital location on the map.

            </p>


            <label>
                Notes
            </label>

            <textarea
                id="notes"
                rows="4"
            ></textarea>


            <button
                type="submit"
            >

                Submit Blood Request

            </button>


            <p
                id="requestMessage"
            ></p>

        </form>

    </section>

</main>


<!-- Leaflet Map JS -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script
    src="../src/js/request-blood.js?v=4"
></script>
```

</body>

</html>
