<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blood Request - Blood Need</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../src/assets/css/style.css?v=5">
    <link rel="stylesheet" href="../src/assets/css/components.css?v=5">
    <link rel="stylesheet" href="../src/assets/css/responsive.css?v=5">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

    <!-- ==================== NAVIGATION ==================== -->
    <nav class="navbar dashboard-nav">
        <div class="container">
            <div class="navbar-brand">
                <a href="../index.html">
                    <span class="blood-icon">🩸</span>
                    Blood <span class="highlight">Need</span>
                </a>
            </div>
            
            <div class="navbar-links" id="navbarLinks">
                <a href="#" onclick="goBackToDashboard(); return false;"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="dashboard-container">
        <div class="container" style="max-width: 800px;">
            
            <!-- Page Header -->
            <div class="welcome-section" style="margin-bottom: 30px;">
                <div>
                    <h2>Create Blood Request</h2>
                    <p style="color: var(--secondary-gray); font-size: 0.95rem; margin-top: 5px;">Enter the details to request emergency blood donation.</p>
                </div>
            </div>

            <!-- Request Form Card -->
            <div class="dashboard-card">
                <form id="requestForm" class="auth-form" style="max-width: 100%;">
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="blood_group">Blood Group Needed</label>
                            <select id="blood_group" required>
                                <option value="">Select Blood Group</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label for="units_needed">Units Needed</label>
                            <input type="number" id="units_needed" min="1" value="1" required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="emergency_level">Emergency Level</label>
                            <select id="emergency_level" required>
                                <option value="">Select Emergency Level</option>
                                <option value="LOW">Low</option>
                                <option value="MEDIUM">Medium</option>
                                <option value="HIGH">High</option>
                                <option value="CRITICAL">Critical</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label for="hospital_name">Hospital Name</label>
                            <div class="input-group">
                                <span class="input-icon"><i class="fas fa-hospital"></i></span>
                                <input type="text" id="hospital_name" required placeholder="Enter hospital name" />
                            </div>
                        </div>
                    </div>

                    <!-- Geolocation map section -->
                    <div class="card-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 25px; margin-bottom: 15px;">
                        <h4 style="font-weight: 700; font-size: 1.1rem; color: var(--navy);"><i class="fas fa-map-marker-alt" style="color: var(--primary-red); margin-right: 8px;"></i> Hospital Location</h4>
                    </div>
                    
                    <p class="map-help-text" style="font-size: 0.85rem; color: var(--secondary-gray); margin-bottom: 12px;">Click on the map below to pinpoint the hospital's coordinate location.</p>
                    
                    <!-- Map Container -->
                    <div id="hospitalMap" style="margin-bottom: 15px;"></div>
                    
                    <!-- Secret location inputs -->
                    <input type="hidden" id="hospital_latitude" required>
                    <input type="hidden" id="hospital_longitude" required>
                    
                    <p id="selectedLocation" class="selected-location" style="font-size: 0.9rem; font-weight: 600; color: var(--primary-red); margin-bottom: 25px; background: #fff5f5; border: 1px solid #ffe3e3; border-radius: 6px; padding: 12px; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-info-circle"></i> Please click on the map to mark the hospital location.
                    </p>

                    <div class="form-group">
                        <label for="notes">Additional Notes</label>
                        <textarea id="notes" rows="3" placeholder="Optional details (e.g. ward details, contact person, etc.)"></textarea>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 30px 0;">

                    <!-- Action Area -->
                    <div style="display: flex; gap: 15px; justify-content: flex-end;">
                        <button type="button" class="btn-secondary" onclick="goBackToDashboard(); return false;" style="width: auto; padding: 12px 25px; border-radius: 8px;">
                            Cancel
                        </button>
                        <button type="submit" class="btn-primary" style="width: auto; padding: 12px 30px; border-radius: 8px;">
                            <i class="fas fa-paper-plane" style="margin-right: 6px;"></i> Submit Request
                        </button>
                    </div>

                    <p id="requestMessage" style="margin-top: 20px; font-weight: 700; text-align: center; font-size: 0.95rem;"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Script Controllers -->
    <script src="../src/js/request-blood.js?v=5"></script>
    
    <script>
        function goBackToDashboard() {
            const user = JSON.parse(localStorage.getItem("user") || "{}");
            const role = (user.role || "").toLowerCase();
            if (role === "donor") {
                window.location.href = "donor-dashboard.html";
            } else if (role === "patient") {
                window.location.href = "patient-dashboard.html";
            } else if (role === "hospital") {
                window.location.href = "hospital-dashboard.html";
            } else if (role === "admin") {
                window.location.href = "admin-dashboard.html";
            } else {
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
