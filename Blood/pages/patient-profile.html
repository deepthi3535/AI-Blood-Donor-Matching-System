<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Patient Profile - Blood Need</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../src/assets/css/style.css?v=5">
    <link rel="stylesheet" href="../src/assets/css/responsive.css?v=5">
    <link rel="stylesheet" href="../src/assets/css/components.css?v=5">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

    <!-- ==================== NAVIGATION ==================== -->
    <nav class="navbar dashboard-nav">
        <div class="container">
            <div class="navbar-brand">
                <a href="../index.html">
                    <span class="blood-icon">🩸</span>
                    Blood <span class="highlight">Need</span>
                </a>
            </div>
            <div class="navbar-links">
                <a href="#" onclick="localStorage.clear(); window.location.href='login.html'; return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </nav>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="dashboard-container">
        <div class="container" style="max-width: 700px;">
            
            <!-- Page Header -->
            <div class="welcome-section" style="margin-bottom: 30px; text-align: center;">
                <h2>Complete Patient Profile</h2>
                <p style="color: var(--secondary-gray); font-size: 0.95rem; margin-top: 5px;">We need a few details before you can request blood.</p>
            </div>

            <!-- Profile Form Card -->
            <div class="dashboard-card">
                <div class="card-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px;">
                    <h3><i class="fas fa-hospital-user" style="color: var(--primary-red); margin-right: 8px;"></i> Medical Profile Information</h3>
                </div>
                
                <form id="patientProfileForm" class="auth-form" style="max-width: 100%;">
                    
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="blood_group">Blood Group</label>
                            <select id="blood_group" required>
                                <option value="">Select Blood Group</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label for="gender">Gender</label>
                            <select id="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="age">Age</label>
                            <input type="number" id="age" min="18" max="100" placeholder="e.g. 25" required />
                        </div>
                        <div class="form-group half">
                            <label for="hospital_name">Default Hospital Name</label>
                            <div class="input-group">
                                <span class="input-icon"><i class="fas fa-hospital"></i></span>
                                <input type="text" id="hospital_name" placeholder="Enter default hospital" required />
                            </div>
                        </div>
                    </div>

                    <!-- Geolocation Section -->
                    <div class="form-section-title" style="margin-top: 25px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
                        <h4 style="font-weight: 700; color: var(--navy);"><i class="fas fa-map-marker-alt" style="color: var(--primary-red); margin-right: 6px;"></i> Location Coordinates</h4>
                    </div>

                    <div class="form-row" style="align-items: flex-end;">
                        <div class="form-group" style="flex: 1; margin-bottom: 15px;">
                            <button type="button" id="getLocationButton" class="btn-secondary" style="width: auto; display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px;">
                                <i class="fas fa-location-arrow"></i> Capture My Coordinates
                            </button>
                            <p id="locationMessage" style="font-size: 0.85rem; font-weight: 600; margin-top: 8px; color: var(--success-green);"></p>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group half">
                            <label for="latitude">Latitude</label>
                            <input type="number" id="latitude" step="any" readonly placeholder="Auto-captured" />
                        </div>
                        <div class="form-group half">
                            <label for="longitude">Longitude</label>
                            <input type="number" id="longitude" step="any" readonly placeholder="Auto-captured" />
                        </div>
                    </div>

                    <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 30px 0;">

                    <!-- Action Area -->
                    <div style="display: flex; gap: 15px; justify-content: flex-end;">
                        <button type="submit" class="btn-primary" style="width: auto; padding: 12px 35px; border-radius: 8px;">
                            <i class="fas fa-save" style="margin-right: 6px;"></i> Complete Profile
                        </button>
                    </div>

                    <p id="profileMessage" style="margin-top: 20px; font-weight: 700; text-align: center; font-size: 0.95rem;"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- Script Controllers -->
    <script src="../src/js/patient-profile.js?v=5"></script>
</body>
</html>
