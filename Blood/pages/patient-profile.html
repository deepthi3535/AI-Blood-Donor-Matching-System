<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Profile</title>

    <link
        rel="stylesheet"
        href="../src/assets/css/common.css"
    >

    <link
        rel="stylesheet"
        href="../src/assets/css/profile.css"
    >

</head>

<body>

    <main class="profile-page">

        <section class="profile-card">

            <h1>Complete Patient Profile</h1>

            <p>
                Enter your details to continue.
            </p>

            <form id="patientProfileForm">

                <label for="blood_group">
                    Blood Group
                </label>

                <select id="blood_group" required>

                    <option value="">
                        Select Blood Group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>


                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    min="18"
                    required
                >


                <label for="gender">
                    Gender
                </label>

                <select id="gender" required>

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="hospital_name">
                    Hospital Name
                </label>

                <input
                    type="text"
                    id="hospital_name"
                    required
                >
<button type="button" id="getLocationButton">
    Use My Current Location
</button>

<p id="locationMessage"></p>
                <label for="latitude">
                    Latitude
                </label>

                <input
                    type="number"
                    id="latitude"
                    step="any"
                >


                <label for="longitude">
                    Longitude
                </label>

                <input
                    type="number"
                    id="longitude"
                    step="any"
                >


                <button type="submit">
                    Save Profile
                </button>

                <p id="profileMessage"></p>

            </form>

        </section>

    </main>

    <script
        src="../src/js/patient.js?v=4"
    ></script>

</body>

</html>
