<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - BloodNeed</title>
    
    <link rel="stylesheet" href="../src/assets/css/style.css">
    <link rel="stylesheet" href="../src/assets/css/responsive.css">
    <link rel="stylesheet" href="../src/assets/css/components.css">
</head>
<body>

    <main class="profile-page">
        <section class="profile-card">
            <h1>Edit Profile</h1>
            <p>Update your personal account and profile information.</p>
            
            <form id="profileForm">
                <!-- User account fields (User table) -->
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" required placeholder="Enter full name">
                
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Enter email address">
                
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="Enter phone number">
                
                <!-- Shared profile fields -->
                <label for="blood_group">Blood Group</label>
                <select id="blood_group" required>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
                
                <label for="age">Age</label>
                <input type="number" id="age" required min="18" placeholder="Enter age">
                
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
                
                <!-- Patient-specific fields (Hidden dynamically for Donors) -->
                <div id="patientFields" style="display: none;">
                    <label for="hospital_name">Hospital Name</label>
                    <input type="text" id="hospital_name" placeholder="Enter hospital name">
                </div>
                
                <!-- Donor-specific fields (Hidden dynamically for Patients) -->
                <div id="donorFields" style="display: none;">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Enter donor address">
                    
                    <label for="donorWeight">Weight (kg)</label>
                    <input type="number" id="donorWeight" min="45" max="200" placeholder="Enter weight">
                    
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                        <input type="checkbox" id="availability" style="margin: 0; width: 20px; height: 20px;">
                        <label for="availability" style="margin: 0;">Available to Donate Now</label>
                    </div>
                </div>
                
                <!-- Shared Geolocation fields -->
                <button type="button" id="updateLocationBtn" class="btn btn-outline" style="margin-bottom: 20px; width: 100%;">
                    Update Location
                </button>
                <p id="locationMessage" style="font-size: 0.8rem; margin-top: -10px; margin-bottom: 20px; text-align: center; color: var(--success);"></p>
                
                <input type="hidden" id="latitude">
                <input type="hidden" id="longitude">
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Update Profile
                </button>
                
                <p id="profileMessage" style="margin-top: 15px; font-weight: 600; text-align: center;"></p>
            </form>
            
            <button type="button" id="backToDashBtn" class="btn btn-outline" style="margin-top: 15px; width: 100%;">
                Back to Dashboard
            </button>
        </section>
    </main>

    <!-- Script imports -->
    <script src="../src/js/profile.js?v=4"></script>
</body>
</html>
