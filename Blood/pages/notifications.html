<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Blood Need</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="../src/assets/css/style.css?v=5">
    <link rel="stylesheet" href="../src/assets/css/components.css?v=5">
    <link rel="stylesheet" href="../src/assets/css/responsive.css?v=5">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

    <!-- ==================== NAVIGATION ==================== -->
    <nav class="navbar dashboard-nav">
        <div class="container">
            <div class="navbar-brand">
                <a href="../index.html">
                    <span class="blood-icon">🩸</span>
                    Blood <span class="highlight">Need</span>
                </a>
            </div>
            
            <div class="navbar-links" id="navbarLinks">
                <a href="#" onclick="goBackToDashboard(); return false;"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="dashboard-container">
        <div class="container" style="max-width: 800px;">
            
            <!-- Page Header -->
            <div class="welcome-section" style="margin-bottom: 30px;">
                <div>
                    <h2>Notifications</h2>
                    <p style="color: var(--secondary-gray); font-size: 0.95rem; margin-top: 5px;">Stay updated about your blood requests and activities.</p>
                </div>
            </div>

            <!-- Notifications Card -->
            <div class="dashboard-card">
                <div class="card-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <h3><i class="fas fa-bell" style="color: var(--primary-red); margin-right: 8px;"></i> Updates List</h3>
                </div>
                
                <div class="card-body" id="notificationsContainer" style="display: flex; flex-direction: column; gap: 15px;">
                    <p class="loading" style="text-align: center; color: var(--secondary-gray); font-weight: 600; padding: 20px;">
                        <i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> Loading notifications...
                    </p>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Script Controllers -->
    <script src="../src/js/notifications.js?v=5"></script>
    
    <script>
        function goBackToDashboard() {
            const user = JSON.parse(localStorage.getItem("user") || "{}");
            const role = (user.role || "").toLowerCase();
            if (role === "donor") {
                window.location.href = "donor-dashboard.html";
            } else if (role === "patient") {
                window.location.href = "patient-dashboard.html";
            } else if (role === "hospital") {
                window.location.href = "hospital-dashboard.html";
            } else if (role === "admin") {
                window.location.href = "admin-dashboard.html";
            } else {
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
