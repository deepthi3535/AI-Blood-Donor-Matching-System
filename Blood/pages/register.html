<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet" href="../src/assets/css/style.css">

</head>

<body>

<div class="container">

    <div class="card" id="registerCard">

        <h1>AI Blood Donor System</h1>

        <h2>Create Account</h2>

        <form id="registerForm">

            <input
                type="text"
                id="full_name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirm_password"
                placeholder="Confirm Password"
                required
            >

            <select id="role">

                <option value="PATIENT">Patient</option>

                <option value="DONOR">Donor</option>

            </select>

            <!-- ================= DONOR FIELDS ================= -->

            <div id="donorFields" style="display:none;">

                <input
                    type="number"
                    id="age"
                    placeholder="Age"
                >

                <div class="form-group">

                    <label>Weight (kg)</label>

                    <input
                        type="number"
                        id="weight"
                        min="50"
                        max="200"
                        placeholder="Enter your weight"
                    >

                </div>

                <select id="gender">

                    <option value="">Select Gender</option>

                    <option value="Male">Male</option>

                    <option value="Female">Female</option>

                    <option value="Other">Other</option>

                </select>

                <select id="blood_group">

                    <option value="">Blood Group</option>

                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>

                </select>

                <input
                    type="text"
                    id="address"
                    placeholder="Address"
                >

                <button
                    type="button"
                    id="getLocation"
                >
                    Get Current Location (Required)
                </button>

                <input
                    type="hidden"
                    id="latitude"
                >

                <input
                    type="hidden"
                    id="longitude"
                >

            </div>

            <!-- ================= END DONOR FIELDS ================= -->

            <button type="submit">

                Register

            </button>

        </form>

        <p>

            Already have an account?

            <a href="login.html">

                Login

            </a>

    </div>

    <!-- ================= OTP VERIFICATION SECTION ================= -->
    <div class="card" id="otpSection" style="display: none;">
        <h1>AI Blood Donor System</h1>
        <h2>Verify Email</h2>
        <p style="margin-bottom: 20px; color: #666;">
            We have sent a 6-digit OTP code to: <br>
            <strong id="otpEmailDisplay" style="color: #d9534f;"></strong>
        </p>
        <form id="otpForm">
            <input
                type="text"
                id="otpCode"
                placeholder="Enter 6-digit OTP"
                maxLength="6"
                required
                style="letter-spacing: 5px; text-align: center; font-size: 1.2em;"
            >
            <button type="submit" class="primary-button" style="margin-top: 15px;">Verify Email</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <button type="button" id="resendOtpBtn" style="background-color: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer;">
                Resend OTP
            </button>
            <p id="resendTimerMessage" style="font-size: 0.9em; margin-top: 8px; color: #666;"></p>
        </div>
        <p style="margin-top: 20px; font-size: 0.95em;">
            <a href="login.html" style="color: #d9534f; text-decoration: none; font-weight: bold;">Back to Login</a>
        </p>
    </div>

</div>

<script src="../src/js/register.js"></script>

</body>

</html>
